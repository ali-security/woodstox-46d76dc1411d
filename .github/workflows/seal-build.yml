name: seal-build

on:
  workflow_dispatch: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Maven 3.6.3
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.6.3/binaries/apache-maven-3.6.3-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.6.3/bin" >> "$GITHUB_PATH"
      - name: Package
        run: mvn -B -V -e --no-transfer-progress -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: woodstox-core-jar
          path: target/woodstox-core-6.2.3.jar
          if-no-files-found: error
